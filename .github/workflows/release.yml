name: Trigger Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 2.3000.1046738589)'
        required: true

permissions:
  actions: write
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN || secrets.GIT_TOKEN || secrets.RELEASE_PAT || secrets.PAT || github.token }}

      - name: Setup SSH
        if: env.HAS_SSH != ''
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          HAS_SSH: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 > ~/.ssh/id_ed25519.pub
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          git remote set-url origin git@github.com:thruqe/WAProto.git

      - name: Setup Git
        run: |
          git config user.name "thruqe"
          git config user.email "thruqe@gmail.com"
          if [ -f ~/.ssh/id_ed25519.pub ]; then
            git config gpg.format ssh
            git config user.signingkey ~/.ssh/id_ed25519.pub
            git config commit.gpgsign true
            git config tag.gpgsign true
          fi

      - name: Release Tag
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GIT_TOKEN || secrets.RELEASE_PAT || secrets.PAT || github.token }}
        run: |
          tag="v${{ inputs.version }}"
          git tag "${tag}"
          git push origin "${tag}"
          gh workflow run publish.yml --ref "${tag}"
