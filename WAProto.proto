		optional bool importListEnabled = 1;
		optional bool companionSupportEnabled = 2;
		optional bool campaignSyncEnabled = 3;
		optional bool insightsSyncEnabled = 4;
		optional int32 recipientLimit = 5;
		optional bool proCompanionSupportEnabled = 6;
	}

	message ContactRefresh {
		optional bool refreshSupported = 1;
	}

	message LIDMigration {
		optional uint64 chatDbMigrationTimestamp = 1;
	}

	message UserHasAvatar {
		optional bool userHasAvatar = 1;
	}

	optional DeviceCapabilities.ChatLockSupportLevel chatLockSupportLevel = 1;
	optional DeviceCapabilities.LIDMigration lidMigration = 2;
	optional DeviceCapabilities.BusinessBroadcast businessBroadcast = 3;
	optional DeviceCapabilities.UserHasAvatar userHasAvatar = 4;
	optional DeviceCapabilities.MemberNameTagPrimarySupport memberNameTagPrimarySupport = 5;
	optional DeviceCapabilities.AiThread aiThread = 6;
	optional DeviceCapabilities.AiFbidMigration aiFbidMigration = 7;
	optional DeviceCapabilities.BizAiSettingsSync bizAiSettingsSync = 8;
	optional DeviceCapabilities.ContactRefresh contactRefresh = 9;
}

